models:
  - name: dim_listings_cleansed # primary key, should be unique and not
    columns:
      - name: listing_id
        data_tests:
          - unique # check for unique values in certain columns
          - not_null

      - name: host_id
        data_tests:
          - not_null
          - relationships: # every record in a table should be found in a certain column in another table. E.g. every host ID should be a valid host from the host table
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt',
                         'Private room',
                         'Shared room',
                         'Hotel room']